<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="logoBgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3d156b" />
      <stop offset="65%" stop-color="#250946" />
      <stop offset="100%" stop-color="#16042b" />
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333ea" />
      <stop offset="50%" stop-color="#6b21a8" />
      <stop offset="100%" stop-color="#4c1d95" />
    </linearGradient>
  </defs>

  <!-- Outer Ring -->
  <circle cx="100" cy="100" r="97" fill="url(#ringGrad)" />
  <circle cx="100" cy="100" r="92" fill="#130424" />

  <!-- Inner Gradient Disc -->
  <circle cx="100" cy="100" r="88" fill="url(#logoBgGrad)" />
  <circle cx="100" cy="100" r="87" stroke="#6b21a8" stroke-width="1.5" stroke-opacity="0.6" fill="none" />

  <!-- TOP ICON: Smartphone with orange waves -->
  <g transform="translate(85, 24)">
    <rect x="5" y="4" width="18" height="28" rx="4" fill="#16062b" stroke="#7e22ce" stroke-width="2.5" />
    <rect x="8" y="8" width="12" height="17" rx="1.5" fill="#2d0b52" />
    <circle cx="14" cy="28.5" r="1" fill="#7e22ce" />
    
    <path d="M 23 18 C 25 15, 27 12, 31 10" stroke="#f97316" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <path d="M 23 23 C 26 21, 28 18, 32 15" stroke="#f97316" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <path d="M 23 28 C 28 26, 31 22, 34 18" stroke="#f97316" stroke-width="2.5" stroke-linecap="round" fill="none" />
  </g>

  <!-- TEXT: Khelcom (White) -->
  <text x="100" y="108" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="35" letter-spacing="-0.5px">
    Khelcom
  </text>

  <!-- TEXT: business (Vibrant Orange) -->
  <text x="100" y="136" text-anchor="middle" fill="#f97316" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="27" letter-spacing="-0.3px">
    business
  </text>

  <!-- BOTTOM ACCENT: Line & Shopping Cart -->
  <g transform="translate(0, 142)">
    <line x1="50" y1="16" x2="84" y2="16" stroke="#581c87" stroke-width="1.5" stroke-linecap="round" />
    <g transform="translate(93, 11) scale(0.6)">
      <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6" stroke="#7e22ce" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      <circle cx="9" cy="21" r="1.5" fill="#7e22ce" />
      <circle cx="19" cy="21" r="1.5" fill="#7e22ce" />
    </g>
    <line x1="116" y1="16" x2="150" y2="16" stroke="#581c87" stroke-width="1.5" stroke-linecap="round" />
  </g>
</svg>
